<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sherlock OSINT Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--bg2:#161b22;--bg3:#21262d;
  --border:#30363d;--accent:#58a6ff;--green:#3fb950;
  --red:#f85149;--yellow:#e3b341;--text:#e6edf3;--muted:#8b949e;
  --font:system-ui,sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh}
header{background:var(--bg2);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:12px}
header h1{font-size:1.15rem;font-weight:700;letter-spacing:.5px}
header .badge{font-size:.7rem;background:#1f6feb;color:#fff;padding:2px 8px;border-radius:99px}
.layout{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 53px)}
.sidebar{background:var(--bg2);border-right:1px solid var(--border);padding:20px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.main{display:flex;flex-direction:column;overflow:hidden}
label{font-size:.8rem;color:var(--muted);display:block;margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
input[type=text],select,textarea{width:100%;background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:9px 12px;font-size:.9rem;outline:none;transition:border-color .15s}
input[type=text]:focus,select:focus{border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:6px;font-size:.88rem;font-weight:600;cursor:pointer;border:none;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn-primary{background:#238636;color:#fff}
.btn-red{background:#b91c1c;color:#fff}
.btn-ghost{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.section-title{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:6px}
.toggle-row{display:flex;justify-content:space-between;align-items:center}
.toggle{position:relative;width:38px;height:20px}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:#444;border-radius:99px;cursor:pointer;transition:.2s}
.toggle input:checked+.toggle-slider{background:#238636}
.toggle-slider:before{content:"";position:absolute;height:14px;width:14px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s}
.toggle input:checked+.toggle-slider:before{transform:translateX(18px)}
/* tabs */
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--bg2)}
.tab{padding:12px 20px;font-size:.88rem;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);transition:all .15s}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}
.tab-content{display:none;flex:1;overflow:hidden}
.tab-content.active{display:flex;flex-direction:column}
/* results */
#log-area{flex:1;overflow-y:auto;padding:14px 18px;font-family:monospace;font-size:.82rem;line-height:1.6}
#log-area .log-line{color:var(--muted)}
#log-area .found-line{color:var(--green)}
#results-table-wrap{flex:1;overflow-y:auto;padding:0 18px 18px}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{text-align:left;padding:10px 12px;background:var(--bg2);color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.4px;border-bottom:2px solid var(--border);position:sticky;top:0}
td{padding:9px 12px;border-bottom:1px solid var(--border)}
td a{color:var(--accent);text-decoration:none}
td a:hover{text-decoration:underline}
.badge-found{background:#1a4731;color:var(--green);padding:2px 8px;border-radius:99px;font-size:.72rem;font-weight:700}
/* deep osint */
#deep-results{padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.deep-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:14px 16px}
.deep-card .src{font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.deep-card .detail{font-size:.88rem}
.deep-card.found{border-left:3px solid var(--green)}
.deep-card.not-found{border-left:3px solid var(--border)}
/* status bar */
#status-bar{background:var(--bg2);border-top:1px solid var(--border);padding:6px 18px;font-size:.78rem;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--muted);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none!important}
</style>
</head>
<body>

<header>
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="2">
    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
  </svg>
  <h1>Sherlock OSINT Dashboard</h1>
  <span class="badge">v2.0</span>
</header>

<div class="layout">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">

    <div>
      <div class="section-title" style="margin-bottom:10px">Username Search</div>
      <label>Brugernavn / Username</label>
      <input type="text" id="username" placeholder="e.g. john_doe" autocomplete="off">
    </div>

    <div>
      <label>Søgetilstand / Mode</label>
      <select id="mode">
        <option value="all">Alle sites (476+)</option>
        <option value="cheater">Cheater Detector (dating + NSFW)</option>
        <option value="custom">Egne sites</option>
      </select>
    </div>

    <div id="custom-sites-row" class="hidden">
      <label>Sites (kommasepareret)</label>
      <textarea id="custom-sites" rows="4" placeholder="GitHub, Twitter, Instagram" style="resize:vertical"></textarea>
    </div>

    <div class="toggle-row">
      <label style="margin:0">Inkluder NSFW sites</label>
      <label class="toggle"><input type="checkbox" id="nsfw-toggle"><span class="toggle-slider"></span></label>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="btn-search" onclick="startSearch()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Søg
      </button>
      <button class="btn btn-red hidden" id="btn-stop" onclick="stopSearch()">Stop</button>
      <button class="btn btn-ghost" onclick="exportResults('csv')">CSV</button>
      <button class="btn btn-ghost" onclick="exportResults('txt')">TXT</button>
    </div>

    <hr style="border-color:var(--border)">

    <div>
      <div class="section-title" style="margin-bottom:10px">Deep OSINT</div>
      <label>Mål / Target</label>
      <input type="text" id="deep-target" placeholder="username / email / domain" autocomplete="off">
      <label style="margin-top:10px">Type</label>
      <select id="deep-kind">
        <option value="username">Brugernavn</option>
        <option value="email">E-mail</option>
        <option value="domain">Domæne</option>
      </select>
      <button class="btn btn-primary" style="margin-top:10px;width:100%" onclick="runDeep()">
        Analyser
      </button>
    </div>

    <div id="count-box" style="margin-top:auto;font-size:.8rem;color:var(--muted)">
      Fund: <span id="found-count">0</span>
    </div>
  </aside>

  <!-- ── Main ── -->
  <main class="main">
    <div class="tabs">
      <div class="tab active" onclick="switchTab('live')">Live output</div>
      <div class="tab" onclick="switchTab('table')">Resultater</div>
      <div class="tab" onclick="switchTab('deep')">Deep OSINT</div>
    </div>

    <div class="tab-content active" id="tab-live">
      <div id="log-area"></div>
    </div>

    <div class="tab-content" id="tab-table">
      <div id="results-table-wrap">
        <table id="results-table">
          <thead><tr><th>#</th><th>Site</th><th>URL</th><th>Status</th></tr></thead>
          <tbody id="results-body"></tbody>
        </table>
      </div>
    </div>

    <div class="tab-content" id="tab-deep">
      <div id="deep-results">
        <p style="color:var(--muted);font-size:.88rem">Kør en Deep OSINT-analyse fra sidepanelet.</p>
      </div>
    </div>

    <div id="status-bar">
      <span id="status-text">Klar</span>
      <span id="found-status"></span>
    </div>
  </main>
</div>

<script>
let currentSid = null;
let evtSource = null;
let results = [];

document.getElementById('mode').addEventListener('change', function(){
  document.getElementById('custom-sites-row').classList.toggle('hidden', this.value !== 'custom');
});

function switchTab(name){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['live','table','deep'][i]===name));
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
}

async function startSearch(){
  const username = document.getElementById('username').value.trim();
  if(!username){alert('Indtast et brugernavn'); return;}
  const mode = document.getElementById('mode').value;
  const nsfw = document.getElementById('nsfw-toggle').checked;
  const sitesRaw = document.getElementById('custom-sites').value;
  const sites = mode==='custom' ? sitesRaw.split(',').map(s=>s.trim()).filter(Boolean) : [];

  // reset UI
  results = [];
  document.getElementById('log-area').innerHTML='';
  document.getElementById('results-body').innerHTML='';
  document.getElementById('found-count').textContent='0';
  document.getElementById('found-status').textContent='';
  setStatus('<span class="spinner"></span> Søger…');
  document.getElementById('btn-search').disabled=true;
  document.getElementById('btn-stop').classList.remove('hidden');
  switchTab('live');

  if(evtSource){evtSource.close();evtSource=null;}

  const r = await fetch('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,mode,nsfw,sites})});
  const j = await r.json();
  if(!r.ok){setStatus('Fejl: '+j.error);return;}
  currentSid = j.search_id;

  evtSource = new EventSource('/api/stream/'+currentSid);
  evtSource.onmessage = e => {
    const msg = JSON.parse(e.data);
    if(msg.type==='result'){
      addResult(msg.data);
    } else if(msg.type==='log'){
      appendLog(msg.text, false);
    } else if(msg.type==='done'){
      evtSource.close();
      searchDone();
    }
  };
  evtSource.onerror = ()=>{evtSource.close();searchDone();};
}

function addResult(r){
  results.push(r);
  const n = results.length;
  document.getElementById('found-count').textContent=n;
  document.getElementById('found-status').textContent=`${n} fund`;
  appendLog(`[+] ${r.site}: ${r.url}`, true);
  const tr = document.createElement('tr');
  tr.innerHTML=`<td>${n}</td><td>${escHtml(r.site)}</td><td><a href="${escHtml(r.url)}" target="_blank">${escHtml(r.url)}</a></td><td><span class="badge-found">FUNDET</span></td>`;
  document.getElementById('results-body').appendChild(tr);
}

function appendLog(text, isFound){
  const el = document.createElement('div');
  el.className = isFound?'found-line':'log-line';
  el.textContent = text;
  const area = document.getElementById('log-area');
  area.appendChild(el);
  area.scrollTop = area.scrollHeight;
}

function searchDone(){
  document.getElementById('btn-search').disabled=false;
  document.getElementById('btn-stop').classList.add('hidden');
  setStatus(`Søgning fuldført — ${results.length} fund`);
}

async function stopSearch(){
  if(!currentSid) return;
  await fetch('/api/stop/'+currentSid,{method:'POST'});
  if(evtSource){evtSource.close();evtSource=null;}
  searchDone();
}

async function exportResults(fmt){
  if(!currentSid){alert('Ingen aktiv søgning');return;}
  window.open(`/api/export/${currentSid}?fmt=${fmt}`);
}

async function runDeep(){
  const target = document.getElementById('deep-target').value.trim();
  const kind = document.getElementById('deep-kind').value;
  if(!target){alert('Indtast et mål');return;}
  switchTab('deep');
  const box = document.getElementById('deep-results');
  box.innerHTML='<span class="spinner"></span> Analyserer…';
  const r = await fetch('/api/deep',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target,kind})});
  const j = await r.json();
  box.innerHTML='';
  if(!r.ok){box.innerHTML='<p style="color:var(--red)">'+escHtml(j.error)+'</p>';return;}
  j.results.forEach(item=>{
    const card = document.createElement('div');
    card.className='deep-card '+(item.found?'found':'not-found');
    const link = item.url ? `<br><a href="${escHtml(item.url)}" target="_blank" style="color:var(--accent);font-size:.82rem">${escHtml(item.url)}</a>` : '';
    card.innerHTML=`<div class="src">${escHtml(item.source)}</div><div class="detail">${escHtml(item.detail)}${link}</div>`;
    box.appendChild(card);
  });
}

function setStatus(html){document.getElementById('status-text').innerHTML=html;}
function escHtml(s){const d=document.createElement('div');d.appendChild(document.createTextNode(s));return d.innerHTML;}
</script>
</body>
</html>
