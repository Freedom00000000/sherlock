name: Build Android APK

on:
  push:
    branches: [master, claude/android-app-improvements]
    paths:
      - 'android-app/**'
  pull_request:
    paths:
      - 'android-app/**'
  workflow_dispatch:   # allows manual trigger from GitHub UI

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android-app/**/*.gradle*', 'android-app/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Download Gradle wrapper JAR
        run: |
          mkdir -p android-app/gradle/wrapper
          curl -fsSL -o android-app/gradle/wrapper/gradle-wrapper.jar \
            https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar

      - name: Make gradlew executable
        run: chmod +x android-app/gradlew

      - name: Build debug APK
        run: cd android-app && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sherlock-android-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish GitHub Release (master only)
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Sherlock Android (latest)
          body: Latest debug APK built from master. Install with "Allow unknown sources" enabled.
          prerelease: true
          files: android-app/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
